<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Hygebra</title>
    <meta name="description" content="Personal Blog">
    <link rel="stylesheet" href="/style.css">
        <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    </head>
<body>
<div class="topbar">
  <button id="menu-toggle" class="menu-btn" title="Toggle Sidebar">☰</button>
  <h2>Haishu Su(Hygebra)</h2>
  <div class="nav-links">
    <a href="/index.html">Homepage</a>
    <a href="/blog/index.html">Blog</a>
  </div>
</div>

<div class="sidebar" id="sidebar-placeholder">
  <!-- Sidebar will be loaded from blog/sidebar.html -->
</div>
<script>
(function(){
  // Determine relative prefix from current page to the blog root
  function getBlogPrefix(){
    const parts = location.pathname.split('/').filter(Boolean);
    const blogIndex = parts.lastIndexOf('blog');
    if (blogIndex === -1) return '';
    const after = parts.length - (blogIndex + 1); // number of segments after 'blog' (including the file)
    const ups = Math.max(0, after - 1);
    return ups > 0 ? '../'.repeat(ups) : '';
  }

  const prefix = getBlogPrefix();
  const sidebarPath = prefix + 'sidebar.html';

  fetch(sidebarPath).then(resp => resp.text()).then(html => {
    try {
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const ul = doc.querySelector('ul');

      // Adjust relative links inside the sidebar so they work from subfolders
      if (ul) {
        ul.querySelectorAll('a').forEach(a => {
          const href = a.getAttribute('href') || '';
          if (!href.match(/^https?:\/\//i) && !href.startsWith('/') && !href.startsWith('../')) {
            a.setAttribute('href', prefix + href);
          }
        });
      }

      const placeholder = document.getElementById('sidebar-placeholder');
      if (placeholder) {
        placeholder.innerHTML = '<h2>Navigation</h2>';
        if (ul) placeholder.appendChild(ul);
      }

      // Patch topbar links so "Homepage" and "Blog" point to the right locations from subfolders
      const homeLink = document.querySelector('.nav-links a[href="../index.html"]');
      if (homeLink) homeLink.setAttribute('href', prefix + '../index.html');
      const blogLink = document.querySelector('.nav-links a[href="index.html"]');
      if (blogLink) blogLink.setAttribute('href', prefix + 'index.html');

    } catch (e) {
      console.error('Failed to parse sidebar fragment', e);
    }
  }).catch(err => {
    console.error('Failed to load sidebar.html', err);
  });
})();
</script>

<div class="container">
  <div class="main">
    <h1 id="convex-optimization">Convex Optimization</h1>
    <p>2026/7/6 Basic Concepts - <a href="note_20260706.html">Note
    20260706</a></p>
  </div>
</div>

<script src="/js/sidebar-control.js"></script>
</body>
</html>
